name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Pristine App
        run: |
          npx --yes create-expo-app pristine-app --template blank
          cp App.js pristine-app/App.js
          cp app.json pristine-app/app.json
          cd pristine-app
          npx expo install @react-native-async-storage/async-storage
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lahiqan-app-release
          path: pristine-app/android/app/build/outputs/apk/release/*.apk
